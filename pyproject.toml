[project]
name = "interview-copilot-workflow"
version = "0.1.0"
description = "Traceable Interview Prep Workflow V1 built with LangGraph and Gemini"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langsmith>=0.4.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.12.0",
]

[project.scripts]
interview-copilot = "interview_prep.run:main"
validate-fixture = "interview_prep.validate_fixture:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_prep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
